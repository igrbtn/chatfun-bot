help: |
  Привет! Я умею две вещи.

  <b>Видео по ссылке</b> - кинь ссылку на YouTube, Shorts, Instagram Reels, Facebook, TikTok, X/Twitter, VK, Reddit - пришлю ролик прямо в чат.

  <b>{title}</b> (в группе):
  /hero - провести розыгрыш
  /push - выбранный за день может раз попытаться спихнуть титул (ответом на сообщение жертвы)
  /top - таблица лидеров
  /reg - участвовать в розыгрыше
  /unreg - выйти из розыгрыша
  /title Название - переименовать игру (админы чата)
  /add @user Имя - добавить участников (админы чата)
  /tone 1-5 - тон бота: 1 ультра-токсичный ... 5 приторно милый (админы чата)

  <b>Ещё развлечения</b>:
  /pair - парочка дня, /pairs - частые пары
  /stats [день|неделя|все] - кто сколько пишет
  /who вопрос - бот выберет кого-то из чата
  /ball, /coin, /roll [N] - шар, монетка, число
  /duel - дуэль (ответом на сообщение), /duels - таблица

  Участники попадают в розыгрыш автоматически, когда пишут в чат.

