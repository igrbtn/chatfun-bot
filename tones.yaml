# Per-chat tone overrides. Tone 3 ("normal") is texts.yaml itself; a key missing here falls back to it.
# Placeholders must match texts.yaml (tests check every tone). Roast the person, never a group:
# no slurs, nothing about nationality, gender, orientation, religion, health or looks.

1:  # ultra toxic: heavy swearing, roasts the person, local ROI meme
  coin_tie_start:
    - "Ничья на вершине \"{title}\": {names} - по {score}. Хуле спорить, кидаю монетку..."
    - "У {names} по {score} в \"{title}\". Штош, решит монетка, а не ваше нытьё..."
    - "{names} делят первое место по {score}. Монетка, рассуди этих долбоёбов..."
  coin_tie_round:
    - "{a} против {b}: {side}! Дальше лезет {winner}."
    - "Монетка между {a} и {b} - {side}. {winner} проходит, второй нахуй."
    - "{a} vs {b}: {side}. {winner} идёт дальше, уважаемо."
    - "Бросок {a} против {b}: {side}, повезло {winner}. Пока что."
  coin_tie_edge:
    - "{a} против {b}: монетка встала на ребро, ахуеть! Всё, бросать больше нечего."
    - "Ебать, ребро! Между {a} и {b} монетка стоит торчком. Стоп игра."
  coin_tie_all:
    - "Монетка на ребре - такое раз в жизни. Каждому по +1, долбоёбы: {names}."
    - "Ребро, всем по баллу и разошлись: {names}. Что с нами стало..."
  coin_tie_winner:
    - "Монетка сказала своё: {mention} забирает +1 и единолично главное днище \"{title}\"."
    - "Самый-самый {title_lc} по воле монетки - {mention}. +1, соси."
    - "{mention} выиграл в орлянку звание \"{title}\". +1 к позору."
  tie_bonus:
    - "{mention} получает +1 к счёту. Народ решил, народ и выебал."
    - "+1 балл для {mention}. Ничья закрыта, опрос нахуй."
    - "{mention} забирает +1. Остальные - по домам."
  hero_chance:
    - "Шанс был {pct}%. Не повезло, долбоёб."
    - "Всего {pct}% шанса, и всё равно ты. Это талант."
    - "Шанс {pct}%. Больше пиздеть надо было меньше."
